<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;700&family=JetBrains+Mono&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #fafaf8; --fg: #171717; --muted: #6b7280; --accent: #c26e38; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0a; --fg: #fafaf8; --muted: #9ca3af; --accent: #f59e0b; } }
    * { margin: 0; box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg); font-family: 'Inter', system-ui, sans-serif; text-align: center; }
    .code { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--muted); }
    h1 { font-size: clamp(36px, 8vw, 64px); letter-spacing: -0.04em; margin: 8px 0 12px; }
    .note { font-family: 'Caveat', cursive; font-size: 24px; color: var(--accent); }
    a { display: inline-block; margin-top: 28px; padding: 12px 24px; border-radius: 999px; background: var(--fg); color: var(--bg); text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>
  <div>
    <p class="code">// 404</p>
    <h1>page not found</h1>
    <p class="note">well, this is awkward</p>
    <a href="/">take me home</a>
  </div>
</body>
</html>
